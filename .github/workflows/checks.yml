name: AmazingHelper build and release
on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    env:
      QT_QPA_PLATFORM: offscreen
      AMAZING_OVERLAY_PIPE: amazing-helper-ci-${{ github.run_id }}-${{ github.run_attempt }}
      AMAZING_OVERLAY_DATA: ${{ github.workspace }}\.cache\ci-data
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12.8'
          cache: pip
      - name: Project environment
        run: |
          python -m venv .venv
          .venv/Scripts/python.exe -m pip install -r requirements.txt
      - name: Validate release tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          $version = (Get-Content amazing_overlay/version.json | ConvertFrom-Json).version
          if ($env:GITHUB_REF_NAME -ne "v$version") { throw 'Tag and application version differ' }
      - name: Python checks
        run: |
          .venv/Scripts/python.exe -m unittest discover -s tests -v
          Write-Output "unittest exit code: $LASTEXITCODE"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Write-Output 'Compile legacy entry point'
          .venv/Scripts/python.exe -m py_compile legacy/law_overlay.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Write-Output 'Run isolated legacy smoke'
          .venv/Scripts/python.exe legacy/test_overlay_linux.py --smoke
          Write-Output "legacy smoke exit code: $LASTEXITCODE"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Native x86 build and tests
        run: |
          cmake -S native -B native/out -A Win32
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build native/out --config Release --parallel
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ctest --test-dir native/out -C Release --output-on-failure
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Installer compiler
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/acquire_inno.ps1
      - name: Frozen runtime, installer and portable ZIP
        run: .venv/Scripts/python.exe scripts/build_distribution.py --native-dir native/out/Release --iscc .cache/tools/inno/ISCC.exe
      - name: Installer lifecycle and data preservation
        run: .venv/Scripts/python.exe scripts/check_installer.py --setup .cache/dist/AmazingHelperSetup.exe
      - name: Chromium smoke
        run: |
          .venv/Scripts/python.exe -m playwright install chromium
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .venv/Scripts/python.exe scripts/check_portable.py .cache/dist/portable-build/AmazingHelper/AmazingHelper.exe --settings-check --browser-check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: AmazingHelper-distribution
          if-no-files-found: error
          path: |
            .cache/dist/AmazingHelperSetup.exe
            .cache/dist/AmazingHelper-*-portable-x64.zip

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: windows-2022
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12.8'
          cache: pip
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: AmazingHelper-distribution
          path: .cache/dist
      - name: Signing environment
        run: |
          python -m venv .venv
          .venv/Scripts/python.exe -m pip install -r requirements.txt
      - name: Sign and verify exact release artifacts
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: .venv/Scripts/python.exe scripts/release_metadata.py
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$env:GITHUB_REF_NAME" --verify-tag --generate-notes --title "AmazingHelper $env:GITHUB_REF_NAME" .cache/dist/AmazingHelperSetup.exe .cache/dist/AmazingHelper-*-portable-x64.zip .cache/dist/updates.json .cache/dist/updates.sig .cache/dist/SHA256SUMS.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
